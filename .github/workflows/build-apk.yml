# Builds the NightRider Driver APK in the cloud, so nobody needs Android Studio.
#
# How to run it: on GitHub open the repo -> "Actions" tab -> pick
# "Build driver app APK" on the left -> "Run workflow" button.
# About 3-5 minutes later the finished APK is downloadable two ways:
#   * the run's "Artifacts" box at the bottom of the run page
#   * the repo's "Releases" page, as NightRider-Driver.apk (easiest link to share)
#
# This file works whether the Android project sits at the top of the repo or in
# a sub-folder (for example "android/") - it finds settings.gradle itself.
#
# If the build fails, the run page's summary shows the real error lines from the
# Gradle log - Kotlin errors start with "e:" - plus Gradle's own "What went
# wrong" block and the end of the log. Copy that block when asking for a fix.

name: Build driver app APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths:
      - '**.gradle'
      - '**.kt'
      - '**.xml'
      - 'app/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build the driver APK
    runs-on: ubuntu-latest

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Find the Android project
        id: find
        run: |
          DIR=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          DIR=$(dirname "$DIR")
          echo "Found Android project in: $DIR"
          test -f "$DIR/app/build.gradle" || { echo "app/build.gradle not found in $DIR"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle is downloaded straight from gradle.org instead of through a
      # marketplace action, so there is one less moving part in the build.
      # 8.7 is the version this project's Android plugin (8.5.2) needs.
      - name: Install Gradle 8.7
        run: |
          set -e
          curl -sSL --retry 3 -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Make sure the Android SDK is usable
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "No Android SDK found on this runner." >&2
            exit 1
          fi
          echo "Android SDK: $SDK"
          echo "Platforms:   $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "Build tools: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "android-34 is missing - trying to install it..."
            SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
            if [ -n "$SM" ]; then
              yes | "$SM" --licenses > /dev/null 2>&1 || true
              "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
            fi
            ls "$SDK/platforms" 2>/dev/null || true
          fi

      - name: Point Gradle at the Android SDK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          cat local.properties

      - name: Show which tools are being used
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          java -version
          gradle --version

      # tee + pipefail keeps the real exit code while also leaving build.log
      # behind, so a failed run still produces something we can read.
      - name: Build the APK
        id: build
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Keep the build log, pass or fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ steps.find.outputs.dir }}/build.log
          if-no-files-found: ignore
          retention-days: 30

      # Puts the real Gradle error on the run page, so the reason for a red X
      # is readable without digging through the step log.
      #
      # The last lines of a failed Gradle log are only a Java stack trace - the
      # useful part is the compiler error above it (lines starting with "e:")
      # and Gradle's own "What went wrong" block. Those are pulled out here
      # first, and the tail of the log is kept only as a fallback.
      - name: Show why it failed
        if: failure()
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          {
            echo "## The build did not finish"
            echo ""
            echo "Nothing you did wrong - the project hit an error."
            echo "Copy everything between the markers below and send it over,"
            echo "and it can be fixed."
            echo ""
            echo "### The actual error messages"
            echo ""
            echo "(Kotlin errors start with \`e:\` - these name the file and line.)"
            echo ""
            echo '```text'
            grep -anE '^e: |^FAILURE:|Execution failed for task|^Caused by:|Unresolved reference|error:|Compilation error' build.log 2>/dev/null | head -80 || echo "(no compiler error lines found)"
            echo '```'
            echo ""
            echo "### Gradle's own summary"
            echo ""
            echo '```text'
            sed -n '/^\* What went wrong/,/^\* Try:/p' build.log 2>/dev/null | head -40 || true
            echo '```'
            echo ""
            echo "### The end of the log"
            echo ""
            echo '```text'
            tail -25 build.log 2>/dev/null || echo "(no build.log was written)"
            echo '```'
            echo ""
            echo "--- END OF BUILD REPORT ---"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Give the APK a friendly name
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK" || { echo "The build produced no APK file."; exit 1; }
          mkdir -p out
          cp "$APK" out/NightRider-Driver.apk
          ls -lh out

      # archive:false keeps this a plain .apk download instead of a zip that
      # has to be opened first.
      - name: Save the APK for download
        uses: actions/upload-artifact@v7
        with:
          name: NightRider-Driver-APK
          path: ${{ steps.find.outputs.dir }}/out/NightRider-Driver.apk
          archive: false
          if-no-files-found: error
          retention-days: 90

      # Uses the gh command that already ships on the runner, so there is no
      # third-party release action involved. A hiccup here does not fail the
      # build - the Artifacts download above is the main path.
      - name: Also put the APK on the Releases page
        if: github.event_name != 'pull_request'
        working-directory: ${{ steps.find.outputs.dir }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "driver-app-${GITHUB_RUN_NUMBER}" \
            "out/NightRider-Driver.apk#NightRider-Driver.apk" \
            --title "NightRider Driver app (build ${GITHUB_RUN_NUMBER})" \
            --notes "Installable Android app for NightRider drivers.

          Tap NightRider-Driver.apk below to download it, open it on the phone,
          and allow installing from this source. Sign in with the NightRider
          driver username and password provided by dispatch."

