# Builds the NightRider Driver APK in the cloud, so nobody needs Android Studio.
#
# How to run it: on GitHub open the repo -> "Actions" tab -> pick
# "Build driver app APK" on the left -> "Run workflow" button.
# About 3-5 minutes later the finished APK is downloadable two ways:
#   * the run's "Artifacts" box at the bottom of the run page
#   * the repo's "Releases" page, as NightRider-Driver.apk (easiest link to share)
#
# This file works whether the Android project sits at the top of the repo or in
# a sub-folder (for example "android/") - it finds settings.gradle itself.

name: Build driver app APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.gradle'
      - '**.kt'
      - '**.xml'
      - 'app/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build the driver APK
    runs-on: ubuntu-latest

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Find the Android project
        id: find
        run: |
          DIR=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          DIR=$(dirname "$DIR")
          echo "Found Android project in: $DIR"
          test -f "$DIR/app/build.gradle" || { echo "app/build.gradle not found in $DIR"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pins the exact Gradle version the project is known to work with.
      # validate-wrappers is off on purpose: this project deliberately ships no
      # gradle/wrapper/gradle-wrapper.jar, and a half-present wrapper makes the
      # action stop before the build even starts.
      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Show which tools are being used
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          java -version
          gradle --version

      # tee + pipefail keeps the real exit code while also leaving build.log
      # behind, so a failed run still produces something we can read.
      - name: Build the APK
        id: build
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Keep the build log, pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.find.outputs.dir }}/build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Explain what to do if it failed
        if: failure()
        run: |
          {
            echo "### The build did not finish"
            echo ""
            echo "Nothing you did wrong - the project hit an error."
            echo ""
            echo "1. Above, open the red step named **Build the APK**."
            echo "2. Copy roughly the last 30 lines."
            echo "3. Send them over and it will be fixed."
            echo ""
            echo "The complete log is also saved as the **build-log** file"
            echo "in the Artifacts box at the bottom of this page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Give the APK a friendly name
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/NightRider-Driver.apk
          ls -lh out

      - name: Save the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: NightRider-Driver-APK
          path: ${{ steps.find.outputs.dir }}/out/NightRider-Driver.apk
          if-no-files-found: error
          retention-days: 90

      - name: Also put the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-app-${{ github.run_number }}
          name: NightRider Driver app (build ${{ github.run_number }})
          body: |
            Installable Android app for NightRider drivers.

            Tap **NightRider-Driver.apk** below to download it, open it on the
            phone and allow installing from this source. On first launch, enter
            your NightRider web address.
          files: ${{ steps.find.outputs.dir }}/out/NightRider-Driver.apk
          fail_on_unmatched_files: true
