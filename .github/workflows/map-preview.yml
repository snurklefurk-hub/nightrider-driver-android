name: Build isolated MapLibre preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nav-prototype/**'
      - '.github/workflows/map-preview.yml'
  push:
    branches: [main]
    paths:
      - 'nav-prototype/**'
      - '.github/workflows/map-preview.yml'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build preview only
        working-directory: nav-prototype
        run: |
          set -euo pipefail
          gradle :prototype:assembleDebug --no-daemon --stacktrace
          test -s prototype/build/outputs/apk/debug/prototype-debug.apk
          mkdir -p out
          cp prototype/build/outputs/apk/debug/prototype-debug.apk out/NightRider-Map-Preview.apk
      - name: Verify separate APK package
        working-directory: nav-prototype
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging out/NightRider-Map-Preview.apk | tee out/apk-info.txt
          grep -q "package: name='com.nightrider.navpreview'" out/apk-info.txt
      - name: Export prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: NightRider-Map-Preview
          path: nav-prototype/out/NightRider-Map-Preview.apk
          if-no-files-found: error
          retention-days: 14
