name: Verify Vela native navigation screen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vela-engine/**'
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/vela-navigation-check.yml'

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.7
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the isolated test emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Launch the real Vela test screen in LIGHT and DARK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: gradle :vela-engine:test :app:testDebugUnitTest :app:connectedDebugAndroidTest --no-daemon
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vela-navigation-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            vela-engine/build/reports/tests/
