plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nightrider.navpreview'
    compileSdk 34
    defaultConfig {
        applicationId 'com.nightrider.navpreview'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-stage-b'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Pinned for reproducibility; MapLibre's documented Android API matches this version.
    implementation 'org.maplibre.gl:android-sdk:13.6.1'
}
