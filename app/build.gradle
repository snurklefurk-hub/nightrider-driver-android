plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nightrider.driver'
    compileSdk 34

    defaultConfig {
        applicationId "com.nightrider.driver"
        minSdk 26
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode = Integer.parseInt((project.findProperty('nrVersionCode') ?: '1').toString())
        versionName = (project.findProperty('nrVersionName') ?: '1.0').toString()
    }

    // A permanently retained keystore is supplied only by the signed-release workflow.
    // Never put signing credentials or the keystore in Git.
    signingConfigs {
        distribution {
            def signingFile = System.getenv('NR_KEYSTORE_PATH')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('NR_STORE_PASSWORD')
                keyAlias System.getenv('NR_KEY_ALIAS')
                keyPassword System.getenv('NR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            signingConfig signingConfigs.distribution
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.6.1'
    testImplementation 'junit:junit:4.13.2'
}

dependencies { implementation project(':vela-engine') }

dependencies { testImplementation 'org.json:json:20240303' }

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
