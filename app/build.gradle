plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nightrider.driver'
    compileSdk 34

    defaultConfig {
        applicationId "com.nightrider.driver"
        minSdk 26
        targetSdk 34
        versionCode (project.findProperty('nrVersionCode') ?: '1').toString().toInteger()
        versionName (project.findProperty('nrVersionName') ?: '1.0').toString()
    }

    // A permanently retained keystore is supplied only by the signed-release workflow.
    // Never put signing credentials or the keystore in Git.
    signingConfigs {
        distribution {
            def signingFile = System.getenv('NR_KEYSTORE_PATH')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('NR_STORE_PASSWORD')
                keyAlias System.getenv('NR_KEY_ALIAS')
                keyPassword System.getenv('NR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            signingConfig signingConfigs.distribution
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

// No external dependencies: the app is built only against the Android
// framework, so a build never has to download anything from Maven.
dependencies {
}
